ABRStrategy.ToolTip="Which rate parameter the ABR governor steers live (comparison modes).\nTarget (QVBR): moves TargetKbps - the validated baseline (B-frames on, non-IDR reset, no forced keyframe).\nCeiling (MaxKbps): moves MaxKbps instead of TargetKbps. On this driver a MaxKbps change may insert a keyframe; that is exactly what this mode exists to expose in a real stream."
ABRLowLatency="ABR Low Latency (no B-frames)"
ABRLowLatency.ToolTip="Comparison mode: disable B-frames and force AsyncDepth=1 so the encoder has no reorder buffer to flush. Live resets become cheaper, at the cost of compression efficiency (no B-frames). Also enables LowDelayBRC for faster rate re-regulation."
